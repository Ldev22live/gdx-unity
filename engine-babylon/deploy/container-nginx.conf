# nginx configuration inside the Docker image (the host's nginx or proxy handles the domain and HTTPS).

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 512;
    gzip_vary on;
    gzip_types text/css text/plain application/javascript text/javascript application/json model/gltf+json image/svg+xml;

    autoindex off;
    location ~ /\. { deny all; }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    location ~* \.html$ {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Songs and glTF models are not in nginx's default type table (and `types {}` would replace the whole table, so the
    # types are set here, per file kind)
    location ~* \.song$ {
        default_type application/json;
        add_header Cache-Control "public, max-age=3600";
        add_header X-Content-Type-Options "nosniff" always;
    }
    location ~* \.gltf$ {
        default_type model/gltf+json;
        add_header Cache-Control "public, max-age=3600";
        add_header X-Content-Type-Options "nosniff" always;
    }
    location ~* \.glb$ {
        default_type model/gltf-binary;
        add_header Cache-Control "public, max-age=3600";
        add_header X-Content-Type-Options "nosniff" always;
    }

    location ~* ^/(samples|models|music)/ {
        add_header Cache-Control "public, max-age=3600";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    # (add_header inside a location replaces these server-level ones, so the locations above repeat nosniff)
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
