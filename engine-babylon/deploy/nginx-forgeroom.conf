# nginx configuration for the Forgeroom web player and editor (static files only; there is no server-side code).
#
# Two ways to use it:
#   1. Its own domain: copy this file to /etc/nginx/sites-available/forgeroom, change `server_name` and the two
#      certificate paths (certbot writes them), then enable it (see INSTALL.md).
#   2. A folder of a site you already serve (for example https://example.com/forgeroom/): keep only the `location`
#      blocks below, put them inside your existing `server { ... }`, and set `alias` to the folder the files are in.
#      The site is built with relative URLs, so it works from any folder.
#
# HTTPS is required for the music studio: browsers only run an AudioWorklet (the sound engine) on a secure page
# (https:// or http://localhost).


server {
    listen 80;
    listen [::]:80;
    server_name forgeroom.example.com;

    # certbot (`sudo certbot --nginx -d forgeroom.example.com`) rewrites this block to add https and a redirect.

    root /var/www/forgeroom;
    index index.html;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 512;
    gzip_vary on;
    gzip_types text/css text/plain application/javascript text/javascript application/json model/gltf+json image/svg+xml;

    # Never list folders, and never serve dotfiles
    autoindex off;
    location ~ /\. { deny all; }

    # Built code and styles have a hash in their name: cache them for a year
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # Pages: always revalidate, so a new release shows up on the next visit
    location ~* \.html$ {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Songs and glTF models are not in nginx's default type table (and `types {}` would replace the whole table, so the
    # types are set here, per file kind)
    location ~* \.song$ {
        default_type application/json;
        add_header Cache-Control "public, max-age=3600";
        add_header X-Content-Type-Options "nosniff" always;
    }
    location ~* \.gltf$ {
        default_type model/gltf+json;
        add_header Cache-Control "public, max-age=3600";
        add_header X-Content-Type-Options "nosniff" always;
    }
    location ~* \.glb$ {
        default_type model/gltf-binary;
        add_header Cache-Control "public, max-age=3600";
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Sample scenes, models and songs keep their names between releases: cache for an hour
    location ~* ^/(samples|models|music)/ {
        add_header Cache-Control "public, max-age=3600";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    # (add_header inside a location replaces these server-level ones, so the locations above repeat nosniff)
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
