import org.teavm.gradle.api.OptimizationLevel

import java.lang.reflect.Modifier

// Web game runtime (TD-036): plays a scene file in the browser through gdx-teavm (TeaVM -> JavaScript), with the
// same GameSession/GameRenderer as the desktop runtime. Output is a static site that any web server (nginx, Caddy)
// can host; see engine-web/README.md.
plugins {
  id 'com.github.xpenatan.gdx-teavm' version "$gdxTeavmVersion"
}

[compileJava, compileTestJava]*.options*.encoding = 'UTF-8'
eclipse.project.name = appName + '-engine-web'

configurations.configureEach {
  // Box2D's JNI build cannot run in a browser; gdx-box2d-gwt (below) is libGDX's pure-Java Box2D with the same API
  exclude group: 'com.badlogicgames.gdx', module: 'gdx-box2d'
  exclude group: 'com.badlogicgames.gdx', module: 'gdx-box2d-platform'
  // Desktop-only pieces pulled in through engine-desktop; the web player never reaches them
  exclude group: 'com.badlogicgames.gdx', module: 'gdx-backend-lwjgl3'
  exclude group: 'com.badlogicgames.gdx', module: 'gdx-platform'
  exclude group: 'org.lwjgl'
}

// The project's Java scripts, compiled into the web build. A browser cannot load classes at run time, so
// generateScriptRegistry lists every concrete script class with its constructor (GeneratedScripts).
def generatedScriptsDir = layout.buildDirectory.dir('generated/sources/scriptRegistry/java')
sourceSets {
  gameScripts {
    java.srcDirs = [ rootProject.file('assets/scripts') ]
  }
  main {
    java.srcDir generatedScriptsDir
  }
}

dependencies {
  implementation project(':engine-core')
  implementation project(':engine-scene')
  implementation project(':engine-render')
  // Shared runtime (GameSession, GameRenderer, ScriptRegistry, GameComponentSerializers), so web and desktop
  // play scenes identically
  implementation project(':engine-desktop')
  implementation("com.badlogicgames.gdx:gdx-box2d-gwt:$gdxVersion") {
    // Only the Java Box2D classes are needed, not the GWT compiler/toolkit
    transitive = false
  }
  implementation sourceSets.gameScripts.output

  gameScriptsImplementation project(':engine-core')
  gameScriptsImplementation project(':engine-scene')
  gameScriptsImplementation project(':engine-render')
  gameScriptsImplementation("com.badlogicgames.gdx:gdx-box2d-gwt:$gdxVersion") {
    transitive = false
  }

  testImplementation "org.junit.jupiter:junit-jupiter-api:5.10.0"
  testRuntimeOnly "org.junit.jupiter:junit-jupiter-engine:5.10.0"
  testRuntimeOnly "org.junit.platform:junit-platform-launcher:1.10.0"
}

def generateScriptRegistry = tasks.register('generateScriptRegistry') {
  description = 'Generates GeneratedScripts, the web build\'s registry of the project\'s script classes.'
  def scriptClasses = sourceSets.gameScripts.output.classesDirs
  def scriptRuntime = sourceSets.gameScripts.runtimeClasspath
  def outputDir = generatedScriptsDir
  inputs.files(scriptRuntime)
  outputs.dir(outputDir)
  doLast {
    def loader = new URLClassLoader(scriptRuntime.files.collect { it.toURI().toURL() } as URL[], (ClassLoader) null)
    def registrations = new TreeMap<String, String>()
    try {
      def scriptBase = loader.loadClass('io.github.ldev22live.gdxunity.engine.scene.scripting.ScriptComponent')
      scriptClasses.each { dir ->
        fileTree(dir).matching { include '**/*.class' }.each { file ->
          def relative = dir.toPath().relativize(file.toPath()).toString()
          def name = relative.substring(0, relative.length() - '.class'.length()).replace(File.separator, '.')
          // Loaded without running static initializers: only the class shape is inspected
          def type = Class.forName(name, false, loader)
          if (!scriptBase.isAssignableFrom(type) || type.isInterface() || Modifier.isAbstract(type.modifiers)) {
            return
          }
          def reachable = Modifier.isPublic(type.modifiers)
          for (def outer = type.enclosingClass; outer != null; outer = outer.enclosingClass) {
            reachable = reachable && Modifier.isPublic(outer.modifiers)
          }
          boolean creatable = reachable && (type.enclosingClass == null || Modifier.isStatic(type.modifiers)) &&
            type.constructors.any { it.parameterCount == 0 }
          if (!creatable) {
            logger.warn("Script ${name} is left out of the web build: it needs to be public (and static if nested) " +
              "with a public no-argument constructor")
            return
          }
          registrations[type.name] = type.canonicalName
        }
      }
    } finally {
      loader.close()
    }
    def source = new StringBuilder()
    source << '// Generated by :engine-web:generateScriptRegistry from assets/scripts. Do not edit.\n'
    source << 'package io.github.ldev22live.gdxunity.engine.web.generated;\n\n'
    source << 'import io.github.ldev22live.gdxunity.engine.desktop.ScriptRegistry;\n\n'
    source << '/** The project\'s script classes, created without reflection (TD-036). */\n'
    source << 'public final class GeneratedScripts {\n'
    source << '    private GeneratedScripts() {\n    }\n\n'
    source << '    /** A registry of every concrete script class under assets/scripts. */\n'
    source << '    public static ScriptRegistry create() {\n'
    source << '        ScriptRegistry registry = new ScriptRegistry();\n'
    registrations.each { binaryName, canonicalName ->
      source << "        registry.register(\"${binaryName}\", ${canonicalName}::new);\n"
    }
    source << '        return registry;\n    }\n}\n'
    def target = outputDir.get().file('io/github/ldev22live/gdxunity/engine/web/generated/GeneratedScripts.java').asFile
    target.parentFile.mkdirs()
    target.setText(source.toString(), 'UTF-8')
    logger.lifecycle("Web script registry: ${registrations.size()} script class(es)")
  }
}

tasks.named('compileJava') {
  dependsOn generateScriptRegistry
}

test {
  useJUnitPlatform()
}

// The project's assets without editor build output: assets/build holds the editor's compiled scripts (.class),
// which the web build compiles in itself and which would otherwise be downloaded on every page load
def webAssetsDir = layout.buildDirectory.dir('web-assets')

// games.json: the bundled sample games for a host page (UrConnex) to list. Names come from each scene file; kind,
// description and controls from the table in assets/samples/README.md, so there is one place to describe a sample.
def gameCatalogDir = layout.buildDirectory.dir('generated/gameCatalog')
def generateGameCatalog = tasks.register('generateGameCatalog') {
  description = 'Writes games.json, the catalog of sample games bundled with the web build.'
  def samplesDir = rootProject.file('assets/samples')
  inputs.dir(samplesDir)
  outputs.dir(gameCatalogDir)
  doLast {
    def rows = [:]
    samplesDir.toPath().resolve('README.md').toFile().readLines('UTF-8').each { line ->
      def cells = line.split(/\|/)*.trim()
      // | `scene.json` | Kind | Shows | Controls | Scripts |
      if (cells.size() >= 6 && cells[1] ==~ /`[^`]+\.json`/) {
        rows[cells[1].replace('`', '')] = [kind: cells[2], description: cells[3], controls: cells[4]]
      }
    }
    def games = []
    samplesDir.listFiles().findAll { it.name.endsWith('.json') }.sort { it.name }.each { file ->
      def row = rows[file.name]
      if (row == null) {
        throw new GradleException("assets/samples/README.md has no table row for ${file.name}; add one so the web " +
          "catalog can describe it")
      }
      def scene = new groovy.json.JsonSlurper().parse(file, 'UTF-8')
      games << [id: file.name - '.json', name: scene.name ?: (file.name - '.json'), kind: row.kind,
                description: row.description, controls: row.controls, scene: "samples/${file.name}".toString()]
    }
    def target = gameCatalogDir.get().file('games.json').asFile
    target.parentFile.mkdirs()
    target.setText(groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson([version: 1, games: games])), 'UTF-8')
    logger.lifecycle("Web game catalog: ${games.size()} game(s)")
  }
}

def stageWebAssets = tasks.register('stageWebAssets', Sync) {
  description = 'Copies assets/ minus assets/build, plus games.json, into the folder the web build bundles.'
  from(rootProject.file('assets')) {
    exclude 'build/**'
  }
  from(generateGameCatalog)
  into(webAssetsDir)
}
// The asset copy runs inside TeaVM's generate/compile tasks, so those must wait for the staged folder
tasks.matching { it.name in ['generateJavaScript', 'generateWasmGC'] || it.name.startsWith('gdx_teavm_web_') }
  .configureEach { dependsOn stageWebAssets }

gdxTeaVM {
  assets.from(webAssetsDir)

  webDefaults {
    mainClass = 'io.github.ldev22live.gdxunity.engine.web.WebLauncher'
    htmlTitle = 'Forgeroom'
    obfuscated = false
    // Our own page (src/web/index.html) is copied in below
    generateIndexHtml = false
  }

  // Development build: readable JavaScript (gdx_teavm_web_js_build / gdx_teavm_web_js_run)
  js {}

  // Deployable build: optimized and minified (gdx_teavm_web_js_release_build), output in build/dist/js/release/webapp
  js('release') {
    optimization = OptimizationLevel.BALANCED
    obfuscated = true
  }
}

// Our page replaces the generated one. It is copied by the tasks that write each web output folder.
def webPage = file('src/web/index.html')
[generateJavaScript: 'dist/js/webapp', gdx_teavm_web_js_release_compile: 'dist/js/release/webapp'].each { taskName, outputDir ->
  tasks.matching { it.name == taskName }.configureEach {
    inputs.file(webPage)
    doLast {
      copy {
        from webPage
        into layout.buildDirectory.dir(outputDir)
      }
    }
  }
}
