# Static hosting for the web game runtime (engine-web). TLS is expected to be terminated in front of this
# container (a host nginx/Caddy reverse proxy), see engine-web/README.md.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    types {
        application/wasm wasm;
    }

    gzip on;
    gzip_comp_level 6;
    gzip_types application/javascript text/javascript application/json text/plain text/css application/wasm
               image/svg+xml model/gltf+json;

    # Only pages of the same site (for example urconnex.com/games/...) may show the game in an iframe. Behind a
    # reverse proxy the browser sees the public origin, so 'self' is that site. add_header is repeated in every
    # location because a location with its own add_header drops the server-level ones.
    # index.html and games.json must not be cached, so a redeploy is picked up on the next page load
    location = /index.html {
        add_header Cache-Control "no-cache";
        add_header Content-Security-Policy "frame-ancestors 'self'" always;
    }

    location = /assets/games.json {
        add_header Cache-Control "no-cache";
        add_header Content-Security-Policy "frame-ancestors 'self'" always;
    }

    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "public, max-age=3600";
        add_header Content-Security-Policy "frame-ancestors 'self'" always;
    }
}
