<!DOCTYPE html>
<!-- Page of the web game runtime (engine-web, TD-036). Replaces gdx-teavm's generated page so the game fills its
     window or iframe exactly: no scrollbars, so Space and the arrow keys never scroll the page while playing. -->
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Forgeroom</title>
        <style>
            html, body {
                margin: 0;
                padding: 0;
                width: 100%;
                height: 100%;
                overflow: hidden;
                background: #000;
            }
            #canvas {
                display: block;
                border: none;
                outline: none;
            }
        </style>
    </head>
    <body oncontextmenu="return false">
        <canvas id="canvas"></canvas>
        <script>
            window.addEventListener("load", () => main());
        </script>
        <script src="app.js"></script>
    </body>
</html>
