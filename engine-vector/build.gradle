[compileJava, compileTestJava]*.options*.encoding = 'UTF-8'
eclipse.project.name = appName + '-engine-vector'

apply plugin: 'java-library'

// Vector shapes (TD-104, roadmap MC.3): paths, fills and strokes, the .vector file, a stated SVG subset (import and export)
// and a headless scanline rasterizer that draws into pixel buffers. Headless; no GL. Uses libGDX's JSON writer/reader.
dependencies {
  api project(':engine-core')

  testImplementation "org.junit.jupiter:junit-jupiter-api:5.10.0"
  testRuntimeOnly "org.junit.jupiter:junit-jupiter-engine:5.10.0"
  testRuntimeOnly "org.junit.platform:junit-platform-launcher:1.10.0"
}

test {
  useJUnitPlatform()
}
