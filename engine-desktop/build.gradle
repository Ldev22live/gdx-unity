[compileJava, compileTestJava]*.options*.encoding = 'UTF-8'
eclipse.project.name = appName + '-engine-desktop'

apply plugin: 'application'

// Game runtime (TD-035): plays a scene file from a project folder; assets are read from that folder, not the classpath
sourceSets {
  // The project's scripts, compiled ahead of time for :engine-desktop:run (the runtime has no compiler)
  gameScripts {
    java.srcDirs = [ rootProject.file('assets/scripts') ]
    compileClasspath += sourceSets.main.compileClasspath + sourceSets.main.output
  }
}
application.mainClass = 'io.github.ldev22live.gdxunity.engine.desktop.DesktopLauncher'
application.applicationName = appName
java.sourceCompatibility = 21
java.targetCompatibility = 21
if (JavaVersion.current().isJava9Compatible()) {
        compileJava.options.release.set(21)
}

dependencies {
  implementation project(':engine-core')
  implementation project(':engine-scene')
  implementation project(':engine-render')
  implementation project(':engine-visualscript')
  implementation project(':engine-animation')
  implementation project(':engine-audio')
  // Jolt 3D physics (TD-028)
  implementation project(':engine-physics')
  implementation "com.badlogicgames.gdx:gdx-backend-lwjgl3:$gdxVersion"
  implementation "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-desktop"
  implementation "com.badlogicgames.gdx:gdx-box2d-platform:$gdxVersion:natives-desktop"
  // Native message box for an exported game's startup failures (TD-046); same version as the editor's file dialogs
  implementation "org.lwjgl:lwjgl-tinyfd:$backendLwjglVersion"
  ["natives-windows", "natives-linux", "natives-linux-arm64", "natives-macos", "natives-macos-arm64"].each { platform ->
    runtimeOnly "org.lwjgl:lwjgl-tinyfd:$backendLwjglVersion:$platform"
  }

  testImplementation "org.junit.jupiter:junit-jupiter-api:5.10.0"
  testRuntimeOnly "org.junit.jupiter:junit-jupiter-engine:5.10.0"
  testRuntimeOnly "org.junit.platform:junit-platform-launcher:1.10.0"
  testRuntimeOnly "com.badlogicgames.gdx:gdx-box2d-platform:$gdxVersion:natives-desktop"
}

test {
  useJUnitPlatform()
}

jar {
  duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

// Plays a sample by default; pass --args="--scene <file>" for another scene of assets/
run {
  dependsOn gameScriptsClasses
  workingDir = rootProject.file('assets').path
  args = ['--scene', 'samples/platformer-2d.json']
  systemProperty 'gdxunity.scripts', sourceSets.gameScripts.java.destinationDirectory.get().asFile.path
  jvmArgs += "--enable-native-access=ALL-UNNAMED"
  def os = System.properties['os.name'].toLowerCase(Locale.ROOT)
  if (os.contains('mac')) jvmArgs += "-XstartOnFirstThread"
}
